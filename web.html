<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://web.zealhighlights.com/">
    <title>Zeal Dev — Human developers, AI speed</title>
    <meta name="description" content="Websites, funnels, CRM and automations that look and work like your brand. Designed and built by real developers, sped up by AI.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Zeal Dev — Human developers, AI speed">
    <meta property="og:url" content="https://web.zealhighlights.com/">
    <meta property="og:site_name" content="Zeal Dev">
    <meta property="og:description" content="Websites, funnels, CRM and automations that look and work like your brand. Designed and built by real developers, sped up by AI.">
    <meta property="og:image" content="https://web.zealhighlights.com/og-image-web.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Zeal Dev — Human developers, AI speed">
    <meta name="twitter:description" content="Websites, funnels, CRM and automations that look and work like your brand. Designed and built by real developers, sped up by AI.">
    <meta name="twitter:image" content="https://web.zealhighlights.com/og-image-web.png">
    
    <!-- Zeal Dev landing (web.zealhighlights.com). Same app bundle as index.html;
         this file exists so link previews, which don't run JS, get Zeal Dev's
         title and image. vercel.json serves it for the web. host. -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load async (media=print swap) so first paint never blocks on
         fonts.googleapis.com; 800/900 added so hero + loader weights are real,
         not synthesized. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet">
    </noscript>
</head>

<body>
    <div id="root"></div>

</body>

</html>
